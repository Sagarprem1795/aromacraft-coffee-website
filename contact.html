<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

  <header>
    <div class="container nav-container">
          <a href="index.html" class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
              <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
              <line x1="6" y1="1" x2="6" y2="4"></line>
              <line x1="10" y1="1" x2="10" y2="4"></line>
              <line x1="14" y1="1" x2="14" y2="4"></line>
            </svg>
            <span>Aroma<span class="logo-accent">Craft</span></span>
          </a>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="brewing-guides.html">Brew Guides</a></li>
          <li><a href="sustainability.html">Direct Trade</a></li>
          <li><a href="locations.html">Locations</a></li>

          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div class="container">
        <h1>Get in Touch</h1>
        <p>Send an inquiry for wholesale orders, café reservations, or brewing workshops.</p>
      </div>
    </div>

    <section class="section-padding container">
      <div class="form-card">
        <form action="#" method="get">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" name="name" placeholder="Jane Doe" required>
          </div>

          <div class="form-group">
            <label for="email-address">Email Address</label>
            <input type="email" id="email-address" name="email" placeholder="jane@example.com" required>
          </div>

          <div class="form-group">
            <label for="topic">Inquiry Type</label>
            <select id="topic" name="topic">
              <option value="general">General Question</option>
              <option value="wholesale">Wholesale Bean Supply</option>
              <option value="workshop">Barista Training &amp; Workshops</option>
              <option value="events">Private Event Booking</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..." required></textarea>
          </div>

          <button type="submit" class="btn" style="width: 100%;">Submit Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-bottom">
      <p>&copy; 2026 AromaCraft Coffee Roasters. All rights reserved.</p>
    </div>
  </footer>

</body>
</html>
